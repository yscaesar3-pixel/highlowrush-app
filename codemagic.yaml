workflows:
  highlowrush-ios:
    name: HighLowRush - iOS Build & TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: oddiro_asc_key
    environment:
      groups:        - ios_signing      vars:
        XCODE_WORKSPACE: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.yutaXXX.highlowrush"
        APP_STORE_APPLE_ID: "6803045346"
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      - name: Fetch signing files (create certificate/profile if they don't exist yet)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up keychain and apply signing files to the Xcode project
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number (directly edit the Xcode project file - more reliable than agvtool)
        script: |
          echo "Codemagic build number: $PROJECT_BUILD_NUMBER"
          cd ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9A-Za-z.]*;/CURRENT_PROJECT_VERSION = $PROJECT_BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj
          grep "CURRENT_PROJECT_VERSION" App.xcodeproj/project.pbxproj
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
